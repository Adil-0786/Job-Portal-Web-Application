{% extends "base_public.html" %}
{% block title %}Finish Signup | JobBoard{% endblock %}
{% block content %}
<section class="auth-layout auth-layout-single">
    <div class="auth-card auth-card-wide">
        <h2>Finish your account setup</h2>
        <p class="auth-muted">Your Google account is verified. Choose how you want to use JobBoard.</p>
        <form method="post" class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="name">Full name</label>
                <input class="form-control" id="name" type="text" value="{{ profile.name }}" disabled>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">Google email</label>
                <input class="form-control" id="email" type="email" value="{{ profile.email }}" disabled>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="role">Account type</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="seeker">Job Seeker</option>
                    <option value="employer">Employer</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="company">Company</label>
                <input class="form-control" id="company" name="company" type="text" placeholder="Required for employers">
            </div>
            <div class="col-12">
                <button class="btn btn-dark app-btn" type="submit">Continue</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
